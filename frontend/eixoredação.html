<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Redacta — Repertórios e Argumentos por Eixo Temático</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
  <!-- BARRA LATERAL ESQUERDA COM ROLAGEM INDEPENDENTE -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <a class="brand" id="brandHome" href="#">
        <span class="brand-mark" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <path d="M7 4C5.34315 4 4 5.34315 4 7V31.5C4 32.3284 4.89543 32.8429 5.59619 32.4049L18 24.6525L30.4038 32.4049C31.1046 32.8429 32 32.3284 32 31.5V7C32 5.34315 30.6569 4 29 4H7Z" fill="currentColor"/>
            <path d="M11 11H25M11 16H25M11 21H19" stroke="var(--brand-mark-lines)" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">Redacta</span>
      </a>
    </div>

    <div class="sidebar-scroll">
      <nav class="sidebar-nav" aria-label="Navegação por Eixos Temáticos">
        <p class="sidebar-label">Eixos Temáticos</p>
        <ul class="nav-list" id="eixosNavList">
          <li><span class="qtd">Carregando eixos...</span></li>
        </ul>
      </nav>
    </div>

  </aside>

  <!-- ÁREA PRINCIPAL DIREITA -->
  <div class="main-area">
    <!-- BARRA DE TOPO COM BUSCA E ALTERNADOR DE TEMA -->
    <header class="topbar">
      <form class="search" role="search" onsubmit="return false">
        <div class="field">
          <svg class="field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <input
            type="search"
            id="searchInput"
            name="q"
            placeholder="Buscar repertórios, temas, autores..."
            autocomplete="off"
            aria-label="Buscar repertórios, temas ou autores"
          >
          <button type="submit" id="searchBtn">Buscar</button>
        </div>
        <ul class="suggest" id="suggestList" aria-label="Temas e recomendações"></ul>
      </form>

      <div class="topbar-actions">
        <button type="button" class="btn-outline" id="btnVerTodos" style="display: none;">Ver todos os temas</button>
        <button type="button" class="theme-toggle" id="themeToggle" title="Alternar entre modo claro e escuro" aria-label="Alternar tema">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- CONTEÚDO CENTRAL DO DASHBOARD -->
    <main class="dashboard-content">
      <!-- Introdução compacta -->
      <section class="page-intro">
        <h1>Repertórios por tema</h1>
        <p>Escolha uma categoria ou pesquise seu próprio tema na busca acima.</p>
      </section>

      <!-- Categorias agrupadas (vindas da API) -->
      <section class="categories-section" aria-label="Categorias de repertório">
        <div class="category-cards" id="categoriasChips">
          <span class="qtd">Carregando categorias...</span>
        </div>
      </section>

      <!-- Seção de Temas, Teses e Repertórios (vindos da API) -->
      <section class="results-section" id="resultsContainer" aria-live="polite">
        <div class="empty-state">Carregando repertórios e teses do banco de dados...</div>
      </section>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
